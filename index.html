<body>
<!-- Text is filled in from i18n.js: data-t = text, data-t-label = aria-label -->
<div id="app">
  <header class="bar top">
    <h1 class="logo">TAPTANITA</h1>
    <div class="bar-btns">
      <div class="seg lang" id="langSeg" role="group" data-t-label="lang">
        <button data-lang="en" class="on" aria-pressed="true">EN</button><button data-lang="es" aria-pressed="false">ES</button>
      </div>
      <button id="btnSound" class="chip" aria-pressed="false"></button>
      <button id="btnHelp" class="chip" data-t-label="help">?</button>
      <button id="btnFinish" class="chip chip-yellow" data-t="finish"></button>
    </div>
  </header>

  <div class="row">
    <div class="seg" id="modeSeg">
      <button data-mode="free" class="on" data-t="mFree"></button>
      <button data-mode="make" data-t="mMake"></button>
      <button data-mode="add" data-t="mAdd"></button>
      <button data-mode="sub" data-t="mSub" data-t-label="mSubLabel"></button>
    </div>
    <div class="picks">
      <label class="base-pick">
        <span class="sr" data-t="baseLabel"></span>
        <select id="baseSel"></select>
      </label>
      <label class="base-pick">
        <span class="sr" data-t="placeLabel"></span>
        <select id="placeSel"></select>
      </label>
    </div>
  </div>

  <div class="row task">
    <p id="prompt" aria-live="polite"></p>
    <div class="seg small" id="digitSeg" data-t-label="sizeLabel">
      <button data-d="1">9</button><button data-d="2" class="on">99</button><button data-d="3">999</button><button data-d="4" hidden>9999</button>
    </div>
  </div>

  <div class="strip" id="strip"></div>

  <main class="stage" id="stage">
    <div id="boards" class="boards"></div>
    <div class="side">
      <div id="cups" class="cups"></div>
      <div class="readout">
        <span class="lbl" data-t="number"></span>
        <span id="readNum" class="num"></span>
        <span id="readDec" class="dec"></span>
        <span id="readAdd" class="add" aria-live="polite" hidden></span>
        <button id="btnEye" class="chip tiny" aria-pressed="true"></button>
      </div>
      <div id="saved" class="saved" data-t-label="savedLabel"></div>
    </div>
    <!-- ADD / SUB, beside the Taptanita's head: the two ways to subtract (SUB) and
         GUIDE, which puts the second number in the choza as in the SEIBE guide -->
    <div class="way" id="corner" hidden>
      <div class="way-set" id="waySeg" role="group" data-t-label="wayLabel">
        <span class="way-h" data-t="wayHead"></span>
        <button data-way="take" class="on" aria-pressed="true"></button>
        <button data-way="on" aria-pressed="false"></button>
      </div>
      <button id="btnGuide" class="guide" aria-pressed="false" data-t-label="guideLabel"></button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <footer class="bar bottom">
    <div class="seg view" id="viewSeg" data-t-label="viewLabel">
      <button data-view="one" class="on" aria-pressed="true" data-t="vOne" data-t-label="vOneLabel"></button><button data-view="all" aria-pressed="false" data-t="vAll" data-t-label="vAllLabel"></button>
    </div>
    <button id="btnClear" class="btn" data-t="clear"></button>
    <button id="btnCheck" class="btn btn-green"></button>
    <button id="btnNext" class="btn btn-blue" data-t="next"></button>
  </footer>

  <!-- base 10: tap a place card to choose its seed -->
  <div id="palette" class="palette" role="dialog" aria-labelledby="palQ" hidden>
    <p id="palQ"></p>
    <div id="palBtns" class="pal-btns"></div>
  </div>

  <div id="helpOv" class="ov" hidden>
    <div class="ov-card">
      <h2 data-t="helpTitle"></h2>
      <ul id="helpList"></ul>
      <details class="about">
        <summary data-t="aboutTitle"></summary>
        <div id="aboutText"></div>
      </details>
      <a class="btn btn-blue link-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfquxhMCYc0-P1XsecwrRD8lhhn3BH4lHCSs4fk78Yk6bnjVw/viewform" target="_blank" rel="noopener" data-t="feedback"></a>
      <button class="btn btn-green" data-close data-t="gotIt"></button>
    </div>
  </div>

  <div id="askOv" class="ov ask" hidden>
    <div class="ov-card" role="dialog" aria-labelledby="askQ">
      <h2 id="askTitle"></h2>
      <p id="askQ"></p>
      <div id="askBtns" class="ask-btns"></div>
      <p id="askHint" class="ask-hint" aria-live="polite"></p>
    </div>
  </div>

  <!-- SUB: CHECK shows the progress so far and the next step -->
  <div id="coachOv" class="ov ask" hidden>
    <div class="ov-card" role="dialog" aria-labelledby="coachTitle">
      <h2 id="coachTitle" data-t="coachTitle"></h2>
      <p id="coachText"></p>
      <button class="btn btn-green" data-close data-t="gotIt"></button>
    </div>
  </div>

  <div id="finishOv" class="ov" hidden>
    <div class="ov-card">
      <h2 data-t="doneTitle"></h2>
      <p id="summary"></p>
      <a class="btn btn-blue link-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfquxhMCYc0-P1XsecwrRD8lhhn3BH4lHCSs4fk78Yk6bnjVw/viewform" target="_blank" rel="noopener" data-t="feedback"></a>
      <button class="btn btn-green" data-close data-t="keepPlaying"></button>
    </div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
